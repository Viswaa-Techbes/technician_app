name: customer_app
description: "Techbes Customer App – Book verified IT services."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Real-time
  socket_io_client: ^3.0.2

  # Payments
  razorpay_flutter: ^1.3.7

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Routing
  go_router: ^14.8.1

  # Utilities
  flutter_dotenv: ^5.2.1
  json_annotation: ^4.9.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  mockito: ^5.4.6
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/.env
